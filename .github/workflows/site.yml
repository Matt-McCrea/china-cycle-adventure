# Builds and deploys the site to GitHub Pages, and turns journal emails into posts.
#   push to main          → build + deploy
#   every 15 min / manual → check the journal inbox; if there are new posts, commit them, then build + deploy
#   GitHub's schedule is unreliable (runs can be late or skipped), so each check also starts the next one
#   ~10 minutes later. Stop the loop: set repository variable JOURNAL_CHAIN=off (Settings → Secrets and
#   variables → Actions → Variables), or disable the workflow in the Actions tab.
name: site

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  ingest:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: site
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.ingest.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - id: ingest
        working-directory: app
        run: npx tsx scripts/ingest-mail.ts
        env:
          JOURNAL_IMAP_USER: ${{ secrets.JOURNAL_IMAP_USER }}
          JOURNAL_IMAP_PASS: ${{ secrets.JOURNAL_IMAP_PASS }}
          JOURNAL_SENDERS: ${{ secrets.JOURNAL_SENDERS }}
          JOURNAL_IMAP_MAILBOX: ${{ vars.JOURNAL_IMAP_MAILBOX }}
      - if: steps.ingest.outputs.changed == 'true'
        run: |
          git config user.name "journal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/journal
          git commit -m "Journal: new post(s)"
          git pull --rebase
          git push

  deploy:
    needs: ingest
    # deploy on code pushes and when the inbox produced new posts (not on every quiet check)
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.ingest.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    concurrency:
      group: site
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci && npm run build
        working-directory: app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - id: pages
        uses: actions/deploy-pages@v4

  # Keep checking even when GitHub's scheduler doesn't fire. Exactly one loop survives: a run only starts
  # the next check if no OLDER check is still active (so duplicate loops die out, and a scheduled run
  # restarts the loop if it ever stopped).
  next:
    needs: [ingest, deploy]
    if: ${{ always() && github.event_name != 'push' && vars.JOURNAL_CHAIN != 'off' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 540
          me=$(gh run view "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --json createdAt -q .createdAt)
          older=$(gh run list -R "$GITHUB_REPOSITORY" -w site.yml -L 30 --json databaseId,status,event,createdAt \
            -q "[.[] | select(.databaseId != $GITHUB_RUN_ID and (.event == \"workflow_dispatch\" or .event == \"schedule\")
                 and (.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\")
                 and .createdAt < \"$me\")] | length")
          if [ "$older" = "0" ]; then gh workflow run site.yml -R "$GITHUB_REPOSITORY" --ref main; echo "next check started"
          else echo "an older check loop is running; letting it continue"; fi
